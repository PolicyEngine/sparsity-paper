name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out l0-paper
        uses: actions/checkout@v4
        with:
          path: l0-paper

      - name: Check out Microcosm
        uses: actions/checkout@v4
        with:
          repository: PolicyEngine/microcosm
          # Pinned to the commit that main's last passing run checked out (2026-07-01).
          # Microcosm renamed its packages to microcosm-* in PR #638 (2026-08-08), while
          # pyproject.toml's editable sources still point at packages/populace-*, so
          # main no longer installs. Repoint both together to move off this pin. This
          # commit includes the proximal L1 solver (method="prox", l1_lambda, PR #184).
          ref: 673da1ca72a2a2d4779ed6fbdd04aba56d259f69
          path: populace

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        working-directory: l0-paper
        run: uv python install 3.13

      - name: Run tests
        working-directory: l0-paper
        # --extra viz so the end-to-end test exercises the figure renderers too.
        run: uv run --locked --extra viz pytest

      - name: Run Ruff
        working-directory: l0-paper
        run: uv run --locked ruff check .
